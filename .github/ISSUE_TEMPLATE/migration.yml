name: Migration Task 🚀
description: Track migration work for the Next.js + Flask transition.
title: "[Migration]"
labels: [migration]

body:

* type: dropdown
  id: migration_type
  attributes:
  label: Migration Type
  description: Select the component being migrated.
  options:
  - Frontend (Next.js)
  - Backend (Flask)
  validations:
  required: true

* type: input
  id: page_or_feature
  attributes:
  label: Page / Feature / Functionality
  description: What page, API, module, or functionality is being migrated?
  placeholder: Login Page, Dashboard, User Profile API, Authentication Module
  validations:
  required: true

* type: textarea
  id: current_implementation
  attributes:
  label: Current Implementation
  description: Briefly describe how this functionality currently works.
  validations:
  required: true

* type: textarea
  id: migration_changes
  attributes:
  label: Planned Changes
  description: Describe what will be migrated and how it will be implemented in Next.js or Flask.
  placeholder: |
  - Convert React page to Next.js page
  - Move API endpoint to Flask Blueprint
  - Update routing
  - Refactor state management
  validations:
  required: true

* type: textarea
  id: acceptance_criteria
  attributes:
  label: Acceptance Criteria
  description: What conditions must be met for this migration to be considered complete?
  placeholder: |
  - Functionality matches existing behavior
  - No UI regressions
  - API responses remain compatible
  - Tests pass
  validations:
  required: true

* type: textarea
  id: references
  attributes:
  label: References / Screenshots
  description: Add screenshots, designs, documentation, or related links.
  validations:
  required: false

* type: checkboxes
  id: checklist
  attributes:
  label: Checklist
  options:
  - label: I have reviewed the existing implementation.
  required: true

  ```
  - label: I have checked for duplicate migration issues.
    required: true

  - label: I have read the contributing guidelines.
    required: true

  - label: I am willing to work on this issue.
    required: false
  ```

* type: checkboxes
  attributes:
  label: GSSoC Participation
  options:
  - label: I am a GSSoC'26 contributor
  required: false
